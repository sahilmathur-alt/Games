<style>
:root{--bg:#0b0b15;--bg2:#13131f;--bg3:#1a1a2e;--text:#f0ede4;--text2:#9896a0;--text3:#4e4c5e;--border:#252535;--border2:#2e2e42;--gold:#d4af37;--gold-dim:rgba(212,175,55,0.12);--red:#d45678;--red-dim:rgba(212,86,120,0.1);--green:#1a9e75;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
#app{min-height:100vh}
.serif{font-family:'DM Serif Display',serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
input[type=text]{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:inherit;font-size:16px;padding:13px 16px;border-radius:var(--rs);width:100%;outline:none;transition:border-color .2s}
input[type=text]:focus{border-color:var(--gold)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;outline:none;cursor:pointer}
input[type=range].gold{background:var(--border2)}input[type=range].gold::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--gold);border-radius:50%;cursor:pointer}input[type=range].gold::-moz-range-thumb{width:18px;height:18px;background:var(--gold);border-radius:50%;cursor:pointer;border:none}
select{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px;border-radius:var(--rs);width:100%;outline:none;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border-radius:var(--rs);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.3px;border:none;text-align:center}
.btn-gold{background:var(--gold);color:#0b0b15}.btn-gold:hover{background:#e8cc6e}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-sm{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--rs);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);transition:all .15s}.btn-sm:hover{background:var(--bg3);color:var(--text)}
.btn:disabled{opacity:.3;cursor:not-allowed}.btn:not(:disabled):active{transform:scale(.98)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.alloc-card{width:100%;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-family:inherit;color:var(--text);text-align:left;transition:all .15s;display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .35s ease forwards}
</style>

// ─── STATE ─────────────────────────────────────────────────────────────────────
let G = {
  screen:'intro', name:'',
  expenses:{ rent:20, food:10, transport:5 },
  dependants:'none',
  sipBase:5000, sipStepUps:[], allocation:'equity', allocHistory:[],
  idx:0, decisions:[], picked:null, ratings:{}, log:[],
  debts:[], // [{id,name,principal,balance,annualRate,tenureMonths,startAge,emi}]
  expPanelOpen:false,
};

// ─── MATH ──────────────────────────────────────────────────────────────────────
function sipFV(m,y,r){if(y<=0||m<=0)return 0;const i=r/12,n=Math.round(y*12);return m*((Math.pow(1+i,n)-1)/i)*(1+i)/100000;}
function getRate(){return ALLOCS.find(a=>a.id===G.allocation)?.rate||0.12;}
function totalSipFV(){const r=getRate();let t=sipFV(G.sipBase,36,r);for(const s of G.sipStepUps)t+=sipFV(s.delta,60-s.atAge,r);return t;}
function evImpact(){return G.decisions.reduce((s,d)=>s+d.corpus,0);}
function projected(x=0){return Math.round(BASE+evImpact()+x+totalSipFV());}
function pctBar(c){return Math.min(Math.max((c-30)/(760-30),0),1)*100;}
function fmt(l){if(l>=100)return`₹${(l/100).toFixed(2)} Cr`;if(l>0)return`₹${Math.round(l)}L`;if(l<0)return`-₹${Math.round(Math.abs(l))}L`;return'₹0';}
function fmtINR(n){return'₹'+Math.round(n).toLocaleString('en-IN');}

// debt math
function calcEMI(p,r,n){if(n<=0)return 0;const i=r/12;if(i===0)return p/n;return p*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1);}
function loanBalance(p,r,n,paid){if(paid>=n)return 0;const i=r/12;const emi=calcEMI(p,r,n);if(i===0)return Math.max(0,p*(1-paid/n));return Math.max(0,p*Math.pow(1+i,paid)-emi*(Math.pow(1+i,paid)-1)/i);}

function addDebt(loan,age){
  const emi=Math.round(calcEMI(loan.principal,loan.annualRate,loan.tenureMonths));
  G.debts.push({...loan,balance:loan.principal,startAge:age,emi});}

function advanceDebts(fromAge,toAge){
  for(const d of G.debts){
    if(d.balance<=0)continue;
    const paid=(toAge-d.startAge)*12;
    d.balance=Math.round(loanBalance(d.principal,d.annualRate,d.tenureMonths,paid));}}

function totalDebt(){return G.debts.reduce((s,d)=>s+Math.max(0,d.balance),0);}
function totalEMI(){return G.debts.filter(d=>d.balance>0).reduce((s,d)=>s+d.emi,0);}

// expense helpers
function expenseRent(){return Math.round(TAKE_HOME*G.expenses.rent/100);}
function expenseFood(){return Math.round(TAKE_HOME*G.expenses.food/100);}
function expenseTransport(){return Math.round(TAKE_HOME*G.expenses.transport/100);}

// ─── SHARED UI ─────────────────────────────────────────────────────────────────
function badge(p){const ph=PC[p];return`<span style="display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;background:${ph.bg};color:${ph.color}">${p.toUpperCase()}</span>`;}

function allocBars(bars){return`<div style="display:flex;height:4px;border-radius:2px;overflow:hidden;gap:1px">${bars.map(b=>`<div style="width:${b.p}%;background:${b.c};border-radius:2px"></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">${bars.map(b=>`<span style="font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${b.c}"></span>${b.l} ${b.p}%</span>`).join('')}</div>`;}

function corpusAndDebtMeters(previewExtra=null){
  const base=projected(),disp=previewExtra!==null?projected(previewExtra):base;
  const delta=previewExtra!==null?projected(previewExtra)-base:null;
  const p=pctBar(disp);
  const alloc=ALLOCS.find(a=>a.id===G.allocation)||ALLOCS[0];
  const debt=totalDebt(),emi=totalEMI();
  const dp=Math.min(debt/7200000,1)*100;

  return`<div style="background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">
      <div>
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em">Projected corpus at 60</div>
        ${delta!==null?`<div style="font-size:11px;font-weight:600;margin-top:2px;color:${delta>=0?'#1a9e75':'#d45678'}">${delta>0?'▲':'▼'} ${fmt(Math.abs(delta))} if you choose this</div>`:''}
      </div>
      <div style="text-align:right">
        <div id="corpusNum" class="serif" style="font-size:24px;color:var(--gold);line-height:1">${fmt(disp)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px">${alloc.label} · ${alloc.rateLabel}</div>
      </div>
    </div>
    <div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:3px">
      <div id="corpusFill" style="height:100%;width:${p}%;background:linear-gradient(90deg,#9b7b20,var(--gold),#e8cc6e);border-radius:3px;transition:width .5s"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:${debt>0?'10px':'0'}">
      <span>Base ₹2Cr · Events ${evImpact()>=0?'+':''}${fmt(evImpact())}</span>
      <span>SIP +${fmt(Math.round(totalSipFV()))}</span>
    </div>
    ${debt>0?`
    <div style="padding-top:8px;border-top:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em">Active debt</span>
        <div style="text-align:right">
          <span style="font-size:13px;font-weight:700;color:#d45678">${fmt(debt/100000)}</span>
          <span style="font-size:10px;color:var(--text3);margin-left:6px">EMI ${fmtINR(emi)}/mo</span>
        </div>
      </div>
      <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden">
        <div style="height:100%;width:${dp}%;background:linear-gradient(90deg,#a02545,#d45678);border-radius:2px;transition:width .5s"></div>
      </div>
    </div>`:'<div style="font-size:10px;color:#1a9e75">No active debt ✓</div>'}

  const avgSat=G.decisions.length>0?G.decisions.reduce((s,d)=>s+(G.ratings[d.id]||0),0)/G.decisions.length:0;
  const cScore=Math.min(50,Math.round((corpus-30)/(760-30)*50));
  const sScore=Math.round(avgSat*10);
  const total=cScore+sScore;
  const sweet=G.decisions.filter(d=>d.corpus>10&&(G.ratings[d.id]||0)>=4);
  const lifeChoice=G.decisions.filter(d=>d.corpus<=0&&(G.ratings[d.id]||0)>=4);
  const alloc=ALLOCS.find(a=>a.id===G.allocation)||ALLOCS[0];
  const dep=DEPENDANTS_OPTS.find(d=>d.v===G.dependants)?.l||'None';

  return`<div style="padding:28px 20px;max-width:640px;margin:0 auto" class="fu">
    <div style="text-align:center;margin-bottom:22px">
      <div style="font-size:40px;margin-bottom:10px">🏁</div>
      <h1 class="serif" style="font-size:30px;margin-bottom:4px">${G.name} at 60</h1>
      <p style="color:var(--text2);font-size:14px">Dependants: ${dep} · Portfolio: ${alloc.label}</p>
    </div>

    <div class="card" style="text-align:center;margin-bottom:14px;padding:24px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:8px">Estimated corpus at 60</div>
      <div class="serif" style="font-size:54px;color:var(--gold);line-height:1">${fmt(corpus)}</div>
      <div style="margin-top:14px"><div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,#9b7b20,var(--gold),#e8cc6e);width:${cp}%;border-radius:3px"></div></div><div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--text3)"><span>₹30L</span><span>₹7.5 Cr</span></div></div>
      <div style="display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap;font-size:12px">
        <span style="color:var(--text3)">Base ₹2Cr</span><span style="color:var(--text3)">·</span>
        <span style="color:${evImpact()>=0?'#1a9e75':'#d45678'}">${evImpact()>=0?'+':''}${fmt(evImpact())} decisions</span><span style="color:var(--text3)">·</span>
        <span style="color:var(--gold)">+${fmt(Math.round(totalSipFV()))} SIP</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
      <div class="card" style="text-align:center;padding:16px 10px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:6px">Journey score</div><div class="serif" style="font-size:36px;color:var(--gold)">${total}</div><div style="font-size:11px;color:var(--text3)">out of 100</div></div>
      <div class="card" style="text-align:center;padding:16px 10px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:6px">Wealth score</div><div class="serif" style="font-size:36px;color:#6e6bcf">${cScore}</div><div style="font-size:11px;color:var(--text3)">out of 50</div></div>
      <div class="card" style="text-align:center;padding:16px 10px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:6px">Life score</div><div class="serif" style="font-size:36px;color:#1a9e75">${sScore}</div><div style="font-size:11px;color:var(--text3)">out of 50</div></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><div style="font-size:14px;font-weight:600">Sweet spots</div><div style="font-size:11px;color:var(--text3)">Decisions that felt right and built well</div></div>
        <div class="serif" style="font-size:30px;color:var(--gold)">${sweet.length}<span style="font-size:15px;color:var(--text3)">/15</span></div>
      </div>
      ${sweet.length>0?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${lifeChoice.length?8:0}px">${sweet.map(d=>`<span style="background:var(--gold-dim);color:var(--gold);padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600">Age ${d.age}: ${d.title}</span>`).join('')}</div>`:''}
      ${lifeChoice.length>0?`<div style="${sweet.length?'margin-top:8px;padding-top:8px;border-top:1px solid var(--border);':''}"><div style="font-size:11px;color:var(--text3);margin-bottom:6px">High satisfaction · lower corpus impact</div><div style="display:flex;flex-wrap:wrap;gap:6px">${lifeChoice.map(d=>`<span style="background:rgba(26,158,117,0.1);color:#1a9e75;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600">Age ${d.age}: ${d.title}</span>`).join('')}</div></div>`:''}
    </div>

    <div class="card" style="margin-bottom:14px"><div style="font-size:13px;color:var(--text2);margin-bottom:14px">Corpus trajectory — projected at 60 across the journey</div><canvas id="cc" height="180"></canvas></div>

    <div class="card" style="margin-bottom:14px">
      <div style="font-size:13px;color:var(--text2);margin-bottom:12px">Every moment, every choice</div>
      ${G.decisions.map(d=>{const dp=PC[d.phase],r=G.ratings[d.id]||0,pos=d.corpus>0,neg=d.corpus<0;return`
      <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
        <div style="width:3px;height:36px;border-radius:2px;background:${dp.color};flex-shrink:0"></div>
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">Age ${d.age}: ${d.title}</div><div style="font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.tag}</div></div>
        <div style="font-size:12px;font-weight:700;color:${pos?'#1a9e75':neg?'#d45678':'var(--text3)'};flex-shrink:0;min-width:48px;text-align:right">${d.corpus>0?'+':''}${fmt(d.corpus)}</div>
        <div style="flex-shrink:0">${[1,2,3,4,5].map(s=>`<span style="font-size:12px;opacity:${r>=s?1:.15}">⭐</span>`).join('')}</div>
      </div>`;}).join('')}
    </div>

    <button class="btn btn-ghost" id="resetBtn">↩ Play again</button>
    <div style="height:48px"></div>
  </div>`;}

// ─── CHART ─────────────────────────────────────────────────────────────────────
function initChart(){
  const el=document.getElementById('cc');
  if(!el||typeof Chart==='undefined')return;
  const labels=G.log.map(p=>`Age ${p.age}`),data=G.log.map(p=>parseFloat((p.corpus/100).toFixed(2)));
  new Chart(el,{type:'line',data:{labels,datasets:[{data,borderColor:'#d4af37',backgroundColor:'rgba(212,175,55,0.07)',fill:true,tension:.35,pointBackgroundColor:'#d4af37',pointBorderColor:'#0b0b15',pointBorderWidth:2,pointRadius:5,borderWidth:2}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{backgroundColor:'#13131f',borderColor:'#2a2a3e',borderWidth:1,titleColor:'#9896a0',bodyColor:'#f0ede4',padding:10,callbacks:{label:ctx=>`₹${ctx.parsed.y.toFixed(2)} Cr`}}},scales:{x:{ticks:{color:'#4e4c5e',font:{size:10}},grid:{color:'rgba(42,42,62,.5)'}},y:{ticks:{color:'#4e4c5e',font:{size:10},callback:v=>`₹${v}Cr`},grid:{color:'rgba(42,42,62,.5)'},beginAtZero:false}}}});}

// ─── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(G.screen==='intro')         app.innerHTML=renderIntro();
  else if(G.screen==='profile')  app.innerHTML=renderProfile();
  else if(G.screen==='sip')      app.innerHTML=renderSipSetup();
  else if(G.screen==='event')    app.innerHTML=renderEvent();
  else if(G.screen==='sat')      app.innerHTML=renderSatisfaction();
  else if(G.screen==='results')  {app.innerHTML=renderResults();setTimeout(initChart,120);}
  else if(G.screen.startsWith('tr-')){const i=parseInt(G.screen.split('-')[1]);app.innerHTML=renderTransition(i);}
  bind();
}

// ─── BIND ──────────────────────────────────────────────────────────────────────
function bind(){
  const $=id=>document.getElementById(id);

  // INTRO
  const ni=$('ni');
  if(ni){ni.addEventListener('input',e=>{G.name=e.target.value;const b=$('startBtn');if(b)b.disabled=!G.name.trim();});ni.addEventListener('keydown',e=>{if(e.key==='Enter'&&G.name.trim()){G.screen='profile';render();}});}
  const sb=$('startBtn');if(sb)sb.onclick=()=>{if(G.name.trim()){G.screen='profile';render();}};

  // PROFILE — expense sliders
  ['rent','food','transport'].forEach(k=>{
    const sl=$(`prf_${k}`);
    if(sl)sl.addEventListener('input',()=>{
      G.expenses[k]=parseInt(sl.value);
      const pp=$(`prf_${k}_pct`),pa=$(`prf_${k}_amt`);
      if(pp)pp.textContent=G.expenses[k];
      if(pa)pa.textContent=fmtINR(TAKE_HOME*G.expenses[k]/100);
      const tp=$('prfTotalPct'),tot=G.expenses.rent+G.expenses.food+G.expenses.transport;
      if(tp)tp.textContent=`${tot}% = ${fmtINR(TAKE_HOME*tot/100)}/mo`;
    });
  });
  const dep=$('depSelect');if(dep)dep.addEventListener('change',e=>G.dependants=e.target.value);
  const tsp=$('toSipBtn');if(tsp)tsp.onclick=()=>{G.screen='sip';render();};

  // SIP SETUP
  const sl=$('sipSlider');
  if(sl)sl.addEventListener('input',()=>{
    G.sipBase=parseInt(sl.value);
    const sd=$('sipDisp');if(sd)sd.textContent=`₹${G.sipBase.toLocaleString('en-IN')}`;
    const a=ALLOCS.find(x=>x.id===G.allocation)||ALLOCS[0];
    const fd=$('sipFvDisp');if(fd)fd.textContent=fmt(Math.round(sipFV(G.sipBase,36,a.rate)));
  });
  document.querySelectorAll('.alloc-card').forEach(btn=>{
    btn.onclick=()=>{
      G.allocation=btn.dataset.alloc;
      document.querySelectorAll('.alloc-card').forEach(b=>{const a=ALLOCS.find(x=>x.id===b.dataset.alloc),sel=G.allocation===b.dataset.alloc;b.style.borderColor=sel?a.color:'var(--border)';b.style.borderWidth=sel?'2px':'1px';b.style.background=sel?`${a.color}18`:'var(--bg2)';});
      const a=ALLOCS.find(x=>x.id===G.allocation)||ALLOCS[0];
      const fd=$('sipFvDisp');if(fd)fd.textContent=fmt(Math.round(sipFV(G.sipBase,36,a.rate)));
    };
  });
  const sok=$('sipOk');if(sok)sok.onclick=()=>{G.log.push({age:24,corpus:projected()});G.screen='event';render();};

  // TRANSITION
  let chosenDelta=0;
  document.querySelectorAll('.sip-step').forEach(btn=>{
    btn.onclick=()=>{
      chosenDelta=parseInt(btn.dataset.delta);
      document.querySelectorAll('.sip-step').forEach(b=>{const s=parseInt(b.dataset.delta)===chosenDelta;b.style.borderColor=s?'var(--gold)':'var(--border)';b.style.borderWidth=s?'2px':'1px';b.style.background=s?'var(--gold-dim)':'var(--bg2)';});
    };
  });
  document.querySelectorAll('.realloc-btn').forEach(btn=>{
    btn.onclick=()=>{
      G.allocation=btn.dataset.alloc;
      document.querySelectorAll('.realloc-btn').forEach(b=>{const a=ALLOCS.find(x=>x.id===b.dataset.alloc),sel=G.allocation===b.dataset.alloc;b.style.borderColor=sel?a.color:'var(--border)';b.style.borderWidth=sel?'2px':'1px';b.style.background=sel?`${a.color}18`:'var(--bg2)';});
    };
  });
  const td=$('transDone');
  if(td)td.onclick=()=>{
    const tIdx=parseInt(G.screen.split('-')[1]),age=TRANS[tIdx].age;
    if(chosenDelta>0){const ex=G.sipStepUps.find(s=>s.atAge===age);if(ex)ex.delta=chosenDelta;else G.sipStepUps.push({atAge:age,delta:chosenDelta});}
    advanceDebts(G.idx>0?EVENTS[G.idx-1]?.age||24:24,age);
    G.log.push({age,corpus:projected()});
    chosenDelta=0;G.screen='event';render();
  };

  // EVENT — expense panel
  const et=$('expToggle');
  if(et)et.onclick=()=>{G.expPanelOpen=!G.expPanelOpen;const p=$('expPanel');if(p)p.style.display=G.expPanelOpen?'block':'none';};
  ['rent','food','transport'].forEach(k=>{
    const s=$(`slider_${k}`);
    if(s)s.addEventListener('input',()=>{
      G.expenses[k]=parseInt(s.value);
      const pp=$(`exp${k}Pct`),pa=$(`exp${k}Amt`);
      if(pp)pp.textContent=G.expenses[k];
      if(pa)pa.textContent=fmtINR(TAKE_HOME*G.expenses[k]/100);
    });
  });
  const rb=$('resetExpBtn');
  if(rb)rb.onclick=()=>{G.expenses={rent:20,food:10,transport:5};G.expPanelOpen=true;render();};

  // EVENT — choices
  document.querySelectorAll('.choice').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.id,ev=EVENTS[G.idx],c=ev.choices.find(x=>x.id===id),p=PC[ev.phase];
      G.picked=G.picked?.id===id?null:c;
      document.querySelectorAll('.choice').forEach(b=>{const sel=G.picked?.id===b.dataset.id;b.style.borderColor=sel?p.color:'var(--border)';b.style.borderWidth=sel?'2px':'1px';b.style.background=sel?p.bg:'var(--bg2)';const l=b.querySelector('span');if(l){l.style.background=sel?p.color:'transparent';l.style.color=sel?'#0b0b15':'var(--text3)';l.style.border=sel?'none':'1px solid var(--border2)';}});
      const num=$('corpusNum'),fill=$('corpusFill');
      if(num){const d=G.picked?projected(G.picked.corpus):projected();num.textContent=fmt(d);num.style.color=G.picked?(G.picked.corpus>=0?'#e8cc6e':'#d45678'):'var(--gold)';if(fill)fill.style.width=pctBar(d)+'%';}
      const cb=$('confirmBtn');if(cb)cb.disabled=!G.picked;
    };
  });

  const cb=$('confirmBtn');
  if(cb)cb.onclick=()=>{
    if(!G.picked)return;
    const ev=EVENTS[G.idx];
    if(G.picked.loan) addDebt(G.picked.loan,ev.age);
    G.decisions.push({id:ev.id,age:ev.age,title:ev.title,phase:ev.phase,tag:G.picked.tag,corpus:G.picked.corpus,hasLoan:!!G.picked.loan});
    G.log.push({age:ev.age,corpus:projected()});
    G.picked=null;
    const next=G.idx+1;
    if(next>=EVENTS.length){advanceDebts(ev.age,60);G.log.push({age:60,corpus:projected()});G.screen='sat';render();}
    else if(TRANS[next]){G.idx=next;G.screen=`tr-${next}`;render();}
    else{advanceDebts(ev.age,EVENTS[next].age);G.idx=next;G.screen='event';render();}
  };

  // SATISFACTION
  document.querySelectorAll('.star').forEach(btn=>{
    btn.onclick=()=>{
      const eid=parseInt(btn.dataset.e),val=parseInt(btn.dataset.v);G.ratings[eid]=val;
      const c=document.getElementById(`st${eid}`);if(c)c.querySelectorAll('.star').forEach((s,i)=>{const lit=val>=(i+1);s.textContent=lit?'⭐':'☆';s.style.opacity=lit?1:.15;});
      const rated=Object.keys(G.ratings).length,rc=$('rc'),tr=$('toRes');
      if(rc)rc.textContent=`${rated} of ${G.decisions.length} rated`;if(tr)tr.disabled=rated<G.decisions.length;
    };
  });
  const tr=$('toRes');if(tr)tr.onclick=()=>{G.screen='results';render();};

  // RESULTS
  const rstBtn=$('resetBtn');
  if(rstBtn)rstBtn.onclick=()=>{G={screen:'intro',name:'',expenses:{rent:20,food:10,transport:5},dependants:'none',sipBase:5000,sipStepUps:[],allocation:'equity',allocHistory:[],idx:0,decisions:[],picked:null,ratings:{},log:[],debts:[],expPanelOpen:false};render();};
}

render();
</script>
</body>
</html>
